<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD Quality Level List</title>
    <style>
        :root {
            --bg: #11141a; --panel: #181d26; --accent: #3b82f6;
            --text: #e2e8f0; --muted: #94a3b8; --border: #242b38;
            --up: #4ade80; --down: #f87171; --new: #facc15;
        }
        * {box-sizing:border-box;margin:0;padding:0;}
        body {font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;}
        header {background:var(--panel);padding:16px 30px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
        h1 {font-size:22px;color:var(--accent);letter-spacing:1px;}
        .wrap {display:flex;gap:20px;max-width:1300px;margin:20px auto;padding:0 20px;}
        .main {flex:1;min-width:0;}
        .side {width:320px;background:#1a1f2b;border:1px solid #2a3242;border-radius:12px;padding:16px;max-height:85vh;overflow-y:auto;}
        .side h3 {font-size:15px;color:var(--accent);padding-bottom:10px;border-bottom:1px solid #2a3242;margin-bottom:12px;position:sticky;top:0;background:#1a1f2b;}
        .top-bar {display:flex;gap:10px;margin-bottom:16px;}
        .search {flex:1;}
        .search input {width:100%;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;outline:none;}
        .search input:focus {border-color:var(--accent);}
        .btn {padding:10px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:#2a3242;color:#cbd5e1;}
        .btn.prim {background:var(--accent);color:#fff;}
        .list {background:var(--panel);border-radius:12px;border:1px solid var(--border);overflow:hidden;}
        .item {display:flex;align-items:center;gap:20px;padding:16px 24px;border-bottom:1px solid var(--border);}
        .item:last-child {border-bottom:none;}
        .item:hover {background:#1f2533;}
        .rank {font-size:22px;font-weight:bold;width:50px;color:var(--accent);text-align:center;flex-shrink:0;}
        .thumb {width:140px;height:78px;border-radius:6px;background:#000;overflow:hidden;flex-shrink:0;border:1px solid #2e3848;}
        .thumb img {width:100%;height:100%;object-fit:cover;}
        .info {flex:1;min-width:0;}
        .mname {font-size:18px;font-weight:bold;margin-bottom:4px;}
        .meta {font-size:12.5px;color:var(--muted);display:flex;gap:14px;}
        .log-item {font-size:12.5px;padding:8px 0;border-bottom:1px solid #252d3d;line-height:1.5;}
        .log-date {color:var(--muted);font-size:11px;margin-bottom:2px;}
        .up {color:var(--up);} .down {color:var(--down);} .new {color:var(--new);}
        .empty {color:var(--muted);font-size:13px;text-align:center;padding:20px;}
        @media(max-width:900px){.wrap{flex-direction:column;padding:0 12px;margin:12px auto;}.side{width:100%;max-height:250px;}}
    </style>
</head>
<body>

<header>
    <h1>GD QUALITY LEVEL LIST</h1>
    <span style="font-size:12px;color:var(--muted);">시트에서 동기화됨</span>
</header>

<div class="wrap">
    <div class="main">
        <div class="top-bar">
            <div class="search"><input type="text" id="q" placeholder="맵 이름으로 검색..."></div>
            <button class="btn prim" onclick="load()">🔄 새로고침</button>
        </div>
        <div class="list" id="list"><div style="padding:40px;text-align:center;color:var(--muted);">불러오는 중...</div></div>
    </div>
    <div class="side">
        <h3>📋 최근 변경 로그</h3>
        <div id="log"><div class="empty">불러오는 중...</div></div>
    </div>
</div>

<script>
// ==================================================
// ← 여기에 시트 ID를 넣으세요! ←
// ==================================================
const SHEET_ID = "1BNnjPO04NBhMakagGKkAdrvJxSi2LkxDk-I8mo78lkd";
const MAPS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Ranking`;
const LOG_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Changelog`;

let maps = [], logs = [];

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const headers = parseLine(lines[0]);
  const res = [];
  for (let i=1; i<lines.length; i++) {
    const vals = parseLine(lines[i]);
    const row = {};
    headers.forEach((h, idx) => row[h.trim().toLowerCase()] = vals[idx]||"");
    res.push(row);
  }
  return res;
}
function parseLine(line) {
  const r=[],c='',q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){q&&line[i+1]==='"'?(c+='"',i++):(q=!q);}
    else if(ch===','&&!q){r.push(c.trim());c='';}
    else c+=ch;
  }
  r.push(c.trim());return r;
}
function getVid(url){
  if(!url)return'';
  let m;
  if((m=url.match(/youtu\.be\/([\w-]+)/)))return m[1];
  if((m=url.match(/v=([\w-]+)/)))return m[1];
  if((m=url.match(/youtube\.com\/embed\/([\w-]+)/)))return m[1];
  return'';
}
function thumb(url){return url?`https://img.youtube.com/vi/${url}/hqdefault.jpg`:'';}
function rateColor(r){
  const x=(r||'').toLowerCase();
  if(x.includes('mythic'))return'#7dd3fc';
  if(x.includes('legendary'))return'#f472b6';
  if(x.includes('epic'))return'#ef4444';
  if(x.includes('featured'))return'#fb923c';
  if(x.includes('rated'))return'#94a3b8';
  return'#475569';
}

async function load(){
  try{
    const [mRes,lRes]=await Promise.all([fetch(MAPS_URL),fetch(LOG_URL)]);
    maps=parseCSV(await mRes.text()).filter(m=>m.name);
    logs=parseCSV(await lRes.text());
    render(); renderLog();
  }catch(e){
    console.error(e);
    document.getElementById('list').innerHTML='<div style="padding:40px;text-align:center;color:#f87171;">불러오기 실패<br>시트 공개 설정 확인</div>';
    document.getElementById('log').innerHTML='<div class="empty">로그를 불러올 수 없습니다.</div>';
  }
}
function render(filter=''){
  const kw=filter.toLowerCase().trim();
  const list=kw?maps.filter(m=>m.name.toLowerCase().includes(kw)||(m.publisher||'').toLowerCase().includes(kw)):maps;
  document.getElementById('list').innerHTML=list.length?list.map((m,i)=>{
    const r=parseInt(m.rank||i+1,10);
    const v=getVid(m.videourl||m.video||'');
    const c=rateColor(m.rating);
    return `<div class="item">
      <div class="rank">#${r}</div>
      <div class="thumb">${v?`<img src="${thumb(v)}" loading="lazy">`:''}</div>
      <div class="info">
        <div class="mname">${m.name}</div>
        <div class="meta">
          <span>👤 ${m.publisher||'알 수 없음'}</span>
          <span>📦 ${m.objects||'-'}</span>
          <span style="color:${c};">⭐ ${m.rating||'없음'}</span>
        </div>
      </div>
    </div>`;
  }).join(''):'<div style="padding:40px;text-align:center;color:var(--muted);">맵이 없습니다.</div>';
}
function renderLog(){
  if(!logs.length){document.getElementById('log').innerHTML='<div class="empty">변경 기록이 없습니다.</div>';return;}
  const sorted=[...logs].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  document.getElementById('log').innerHTML=sorted.slice(0,50).map(l=>{
    const d=l.date||'',n=l.name||'',t=l.type||'',o=l.oldrank||'',nw=l.newrank||'';
    let ic='',cls='',desc='';
    if(t==='추가'){ic='🆕';cls='new';desc='신규 진입';}
    else if(t==='삭제'){ic='🗑️';cls='down';desc='순위에서 제거됨';}
    else{
      const op=parseInt(o),np=parseInt(nw);
      if(np<op){ic=`▲${op-np}`;cls='up';}
      else{ic=`▼${np-op}`;cls='down';}
      desc=`#${o} → #${nw}`;
    }
    return `<div class="log-item"><div class="log-date">${d}</div><div><strong>${n}</strong> <span class="${cls}">${ic}</span> ${desc}</div></div>`;
  }).join('');
}
document.getElementById('q').addEventListener('input',e=>render(e.target.value));
load();
</script>
</body>
</html>
